name: publish-video
on:
  workflow_dispatch:
    inputs:
      video_url:
        description: "YouTube link to post"
        required: true
      note:
        description: "Optional message above the video"
        required: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - env:
          HOOK: ${{ secrets.NOTIBOT_PUBLIC }}
          URL: ${{ inputs.video_url }}
          NOTE: ${{ inputs.note }}
        run: |
          jq -n --arg c "${NOTE:-Weekly knowledge video:} $URL" '{content:$c}' \
            | curl -sf -H "Content-Type: application/json" -d @- "$HOOK"