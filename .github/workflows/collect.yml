name: collect-candidates
on:
  schedule:
    - cron: "0 7 * * 1"   # Mondays 07:00 UTC
  workflow_dispatch:
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python collect.py
        env:
          DISCORD_REVIEW_WEBHOOK: ${{ secrets.NOTIBOT_PRIVATE }}